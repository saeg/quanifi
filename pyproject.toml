[project]
name = "nifi-quantum-logic"
version = "0.2.0"
description = "Quantum circuit execution for Apache NiFi"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=2.0.0,<2.5",
    "qiskit-aer>=0.13.0",
    "qiskit-ibm-runtime>=0.20.0",
    "qiskit-algorithms>=0.4",
    "qiskit-qasm3-import>=0.6",
    "pennylane>=0.40",
    "pennylane-qiskit>=0.40",
    "cirq>=1.6",
    "qrisp==0.9.5", # pinned to the tested version; 0.9 renamed DefaultBackend -> QrispSimulatorBackend
    "ply>=3.11", # cirq.contrib.qasm_import backend
    "amazon-braket-sdk>=1.119.0",
    "qdk>=1.30,<1.31",
    "openfermion>=1.7", # MoleculeHamiltonian
    "openfermionpyscf>=0.5",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "django>=5.2,<5.3",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<3.3",
    "whitenoise>=6.9,<7",
    "openquantum-sdk", # Open Quantum execution support
    "pyquil>=4.18", # pyQuil component family (local circuits, PyQVM and variational solvers)
    "qiskit-quantuminspire>=0.18.2",
    "quantuminspire>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11", "black>=25.1", "PyYAML>=6.0"]
docs = ["Markdown>=3.7", "Pygments>=2.19"]
# Not a default dependency: iqm-client pulls a large tree that would constrain
# the pinned qiskit/cirq versions. NiFi installs it per-processor from
# QrispIQMDevice.ProcessorDetails.dependencies; this extra is for local runs.
iqm = ["iqm-client>=35.0.0"]

[tool.uv]
# qrisp==0.9.5 pins jax==0.7.1/jaxlib==0.7.1 exactly; pyquil's rigetti-quax
# dependency requires jax>=0.10.2. Both packages import and run correctly
# against jax 0.10.2 in practice (verified: the full qrisp test suite passes
# unchanged), so the pin is overridden here rather than left unresolvable.
override-dependencies = [
    "jax==0.10.2",
    "jaxlib==0.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that run real Qrisp optimisation or long PyQVM sampling (deselect with '-m not slow')",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
